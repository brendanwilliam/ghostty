name: GhosttyiOS
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
packages:
  # 0.12.0 rather than 0.12.1: 0.12.1 swapped its SSH implementation to
  # an unvetted third-party fork of swift-nio-ssh.
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    exactVersion: 0.12.0
  # Citadel's own SSH dependency; listed so the app can import NIOSSH.
  swift-nio-ssh:
    url: https://github.com/Joannis/swift-nio-ssh.git
    minorVersion: 0.3.4
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: 2.81.0
targets:
  GhosttyiOS:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    postCompileScripts:
      # Ghostty's themes come from its build (zig-out/share/ghostty/themes)
      # and are bundled as <app>/GhosttyResources/themes, libghostty's resources dir.
      - name: Copy Ghostty themes
        basedOnDependencyAnalysis: false
        script: |
          src="$SRCROOT/../zig-out/share/ghostty/themes"
          dst="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GhosttyResources/themes"
          if [ ! -d "$src" ]; then
            echo "warning: $src not found. Build GhosttyKit first (see ios/README.md); themes won't be available."
            exit 0
          fi
          rm -rf "$dst"
          mkdir -p "$(dirname "$dst")"
          ditto "$src" "$dst"
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        SWIFT_VERSION: 5.0
        PRODUCT_MODULE_NAME: GhosttyiOS
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: "-lstdc++"
        # The theme copy script reads from ../zig-out.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - framework: ../macos/GhosttyKit.xcframework
        embed: false
      - package: Citadel
        product: Citadel
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreText.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreVideo.framework
      - sdk: IOSurface.framework
  GhosttyiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ghostty.app/Ghostty"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: GhosttyiOS
schemes:
  GhosttyiOS:
    build:
      targets:
        GhosttyiOS: all
        GhosttyiOSTests: [test]
    test:
      targets:
        - GhosttyiOSTests
