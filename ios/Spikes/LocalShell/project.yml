# Throwaway spike: an on-device shell built on ios_system.
# Run ./fetch-frameworks.sh first, then `xcodegen generate`.
name: LocalShellSpike
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    # The last release without a build plugin (which Xcode makes you trust).
    exactVersion: 1.18.0
targets:
  LocalShellSpike:
    type: application
    platform: iOS
    sources:
      - Sources
      # The app's backend protocol, shared unchanged.
      - path: ../../Sources/Session/TerminalBackend.swift
      - path: Resources
        buildPhase: resources
    configFiles:
      Debug: Spike.xcconfig
      Release: Spike.xcconfig
    settings:
      base:
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_CFBundleDisplayName: Local Shell
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: SwiftTerm
      - framework: Frameworks/ios_system.xcframework
      # Loaded by ios_system with dlopen when a command runs: embedded,
      # not linked.
      - framework: Frameworks/files.xcframework
        link: false
      - framework: Frameworks/text.xcframework
        link: false
      - framework: Frameworks/shell.xcframework
        link: false
      - framework: Frameworks/awk.xcframework
        link: false
      - framework: Frameworks/tar.xcframework
        link: false
    postCompileScripts:
      # dash, vim and lg2 ship only device (and Intel simulator) slices,
      # so they're copied for device builds only, with their dependencies.
      - name: Embed device-only frameworks
        basedOnDependencyAnalysis: false
        script: |
          [ "$PLATFORM_NAME" = "iphoneos" ] || exit 0
          dst="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          mkdir -p "$dst"
          for name in dash dashA dashB dashC dashD dashE vim lua_ios lg2 libssh2 openssl; do
            xcf="$SRCROOT/Frameworks/$name.xcframework"
            slice=$(ls "$xcf" | grep -E '^ios-arm64(_arm64e)?$' | head -1)
            rm -rf "$dst/$name.framework"
            ditto "$xcf/$slice/$name.framework" "$dst/$name.framework"
            if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
              codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --preserve-metadata=identifier,entitlements "$dst/$name.framework"
            fi
          done
